<!DOCTYPE html>
<html lang="en">
  <head>
    <title>RPi-Monitor</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RPi-Monitor">
    <meta name="author" content="RPi-Experiences">
    <meta http-equiv="Cache-control" content="public" />

    <!-- CSS -->
    <link href="./css/bootstrap.min.css" rel="stylesheet">
    <link href="./css/rpimonitor.css" rel="stylesheet">
    <link href="./css/rpimonitor.theme.css" rel="stylesheet">

    <!-- Favicon-->
    <link rel="shortcut icon" type="image/png" href="./img/favicon.png">

    <!-- Resolve theme before first paint to avoid a flash of light background -->
    <script>
      (function(){try{
        var t=localStorage.getItem('rpm-theme')||'auto';
        if(t==='auto'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'graphite':'light';}
        document.documentElement.setAttribute('data-theme',t);
      }catch(e){}})();
    </script>
  </head>

  <body>

    <!-- Fixed navbar -->
    <div id='topmenu'></div>

    <!-- Begin page content -->
    <div class="container-fluid">
      <div id="insertionPoint"></div>
    </div>

    <!-- Fixed footer -->
    <div id="footer"></div>
 
    <!-- Dialog place holder -->
    <div id="dialogs"></div>
   
    <!-- Placed at the end of the document so the pages load faster -->
    <script src="./js/jquery.min.js"></script>
    <script src="./js/bootstrap.min.js"></script>
    <script src="./js/rpimonitor.js" charset="utf-8"></script>
    <script src="./js/jsqrencode.min.js"></script>
    <script src="./js/rpimonitor.utils.js" charset="utf-8"></script>
    <script src="./js/rpimonitor.addons.js" charset="utf-8"></script>
  </body>
</html>
